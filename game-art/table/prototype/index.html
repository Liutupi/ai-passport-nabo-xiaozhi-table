<meta charset="utf-8">
<title>NABO 牌桌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+SC:wght@400;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* 布局：左边是工牌实机外形（240×320 屏 + 右侧三键），右边是规则参数与局面面板；窄屏上下堆叠。单一深色牌桌风格。 */
:root {
  --ink: #06110e;
  --panel: #0b1c18;
  --line: #1c3530;
  --fg: #dfeae4;
  --muted: #84a197;
  --brass: #c9a24a;
  --p1: #ff8a3d;
  --p2: #3db8ff;
  --p3: #ff6fa8;
  --p4: #8edb5a;
  --display: "Archivo Black", "Arial Black", sans-serif;
  --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, monospace;
  --cw: 480px;
  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--fg); }
body { font-family: var(--body); font-size: 14px; line-height: 1.6; }
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
header h1 { margin: 0; font-family: var(--display); font-size: 28px; letter-spacing: .02em; font-weight: 400; }
header h1 span { font-family: var(--body); font-weight: 700; font-size: 18px; letter-spacing: .3em; margin-right: 10px; color: var(--brass); }
header p { margin: 0; color: var(--muted); font-family: var(--mono); font-size: 12px; }
.stage { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; justify-content: center; }
.device {
  display: flex; align-items: center; gap: 12px; max-width: 100%;
  padding: 18px 12px 18px 18px; border-radius: 30px;
  background: linear-gradient(160deg, #1d2621, #0e1512);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 30px 60px -24px rgba(0,0,0,.9);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.screen { line-height: 0; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 3px #050907, 0 0 0 4px #24302b; }
canvas#screen { display: block; width: var(--cw); height: calc(var(--cw) * 4 / 3); }
.keys { display: flex; flex-direction: column; gap: 12px; }
.key {
  width: 40px; height: 52px; border-radius: 20px; border: 1px solid #2c3a34;
  background: linear-gradient(#1f2a25, #131b18); color: var(--muted);
  font: 700 11px var(--mono); cursor: pointer; padding: 0;
  box-shadow: 0 2px 0 #070b09;
}
.key.ok { height: 64px; color: var(--brass); }
.key.down { transform: translateY(2px); box-shadow: none; background: #0f1613; color: var(--fg); }
.key:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.panel { flex: 1 1 300px; min-width: 0; max-width: 420px; display: grid; gap: 18px; }
.panel section { display: grid; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.panel section:last-child { border-bottom: 0; }
.panel h2 { margin: 0; font: 700 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.rows { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: baseline; margin: 0; }
.rows dt { color: var(--muted); font-size: 13px; }
.rows dd { margin: 0; font-size: 13px; min-width: 0; }
kbd { font: 700 11px var(--mono); padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--fg); background: var(--panel); }
.live { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.note { margin: 0; color: var(--muted); font-size: 12px; }
.slider { display: grid; grid-template-columns: 6em 1fr 2.4em; gap: 10px; align-items: center; font-size: 13px; }
.slider label { color: var(--muted); }
.slider output { font: 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--brass); }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
input[type=checkbox] { accent-color: var(--brass); }
.seedrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.seedrow input { width: 9em; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: 12px var(--mono); }
button.text { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 3px 10px; font: 12px var(--body); cursor: pointer; }
button.text:hover { color: var(--fg); }
#god { font-family: var(--mono); white-space: pre-wrap; }
#log { margin: 0; padding-left: 1.4em; max-height: 220px; overflow-y: auto; font-size: 13px; color: var(--muted); }
#log li:first-child { color: var(--fg); }
.p1 { color: var(--p1); } .p2 { color: var(--p2); } .p3 { color: var(--p3); } .p4 { color: var(--p4); }
@media (max-width: 560px) { :root { --cw: calc(100vw - 2 * max(16px, env(safe-area-inset-left, 0px)) - 82px); } }
@media (prefers-reduced-motion: reduce) { .key { transition: none; } }
</style>

<main class="wrap">
  <header>
    <h1><span>牌桌</span>NABO TABLE</h1>
    <p>AI Passport 网页原型 · 240×320 · 三键 · 双人同机 · NABO 为占位造型</p>
  </header>

  <div class="stage">
    <div class="device">
      <div class="screen"><canvas id="screen" width="480" height="640" aria-label="游戏画面"></canvas></div>
      <div class="keys">
        <button class="key" id="kUp" aria-label="UP 键">UP</button>
        <button class="key ok" id="kOk" aria-label="OK 键">OK</button>
        <button class="key" id="kDown" aria-label="DOWN 键">DOWN</button>
      </div>
    </div>

    <div class="panel">
      <section>
        <h2>操作</h2>
        <dl class="rows">
          <dt>UP / DOWN</dt><dd><kbd>↑</kbd> <kbd>↓</kbd> 或 <kbd>W</kbd> <kbd>S</kbd>，按住连续滚动</dd>
          <dt>OK</dt><dd><kbd>Enter</kbd> <kbd>Space</kbd>，松开时生效</dd>
          <dt>暂停</dt><dd>对局中长按 OK 2 秒</dd>
        </dl>
        <p class="note">两个人传着玩：交接屏出现时把设备交给对方，对方按 OK 才会看到自己的牌或骰子。</p>
      </section>

      <section>
        <h2>规则参数</h2>
        <div class="slider"><label for="tPlayers">人数</label><input type="range" id="tPlayers" min="2" max="4" step="1"><output id="oPlayers"></output></div>
        <div class="slider"><label for="tTarget">抢几局</label><input type="range" id="tTarget" min="3" max="7" step="2"><output id="oTarget"></output></div>
        <div class="slider"><label for="tDice">每人骰子</label><input type="range" id="tDice" min="3" max="6" step="1"><output id="oDice"></output></div>
        <div class="slider"><label for="tOpen">起叫数量</label><input type="range" id="tOpen" min="1" max="4" step="1"><output id="oOpen"></output></div>
        <div class="toggles">
          <label><input type="checkbox" id="oWild"> 1 点万能（叫过 1 就"斋"）</label>
          <label><input type="checkbox" id="oSound"> 声音</label>
        </div>
        <p class="note">骰子数和起叫在下一局生效。叫数顺序：数量优先，同数量比点数；1 点万能时 1 算最大。</p>
      </section>

      <section>
        <h2>局面</h2>
        <dl class="rows live" id="live"></dl>
        <div class="toggles"><label><input type="checkbox" id="oGod"> 上帝视角（在这里显示双方底牌）</label></div>
        <div id="god" class="note" hidden></div>
        <div class="seedrow">
          <label for="seed">随机种子</label><input id="seed" inputmode="numeric">
          <button class="text" id="reseed">用这个种子回到封面</button>
        </div>
      </section>

      <section>
        <h2>公开记录</h2>
        <ol id="log" reversed></ol>
      </section>
    </div>
  </div>
</main>

<script src="cards.js"></script>
<script src="dice3d.js"></script>
<script src="sound.js"></script>
<script src="assets/nabo_sprites.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const W = 240, H = 320;
const cv = $('screen'), ctx = cv.getContext('2d');
ctx.setTransform(2, 0, 0, 2, 0, 0);

// 配色与 ART_BRIEF 第 8 节一致；vest/shirt/skin 只给占位 NABO 用
const C = {
  felt: '#0E3B36', feltDark: '#082623', wall: '#0A1A17', rim: '#3A2418', brass: '#C9A24A',
  p1: '#FF8A3D', p2: '#3DB8FF', p3: '#FF6FA8', p4: '#8EDB5A', card: '#F4F1E8', ink: '#14100E', red: '#D23A3A',
  back: '#6E2638', muted: '#8FB3A8', vest: '#4B3560', shirt: '#EDE6D6', skin: '#F6E7CF',
};
const F_BODY = '"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif';
const F_MONO = '"Space Mono",ui-monospace,Menlo,monospace';
const F_DISP = '"Archivo Black","Arial Black",sans-serif';
const PCOL = [C.p1, C.p2, C.p3, C.p4];
const PNAME = ['玩家 1', '玩家 2', '玩家 3', '玩家 4'];
// 座位：两人左右对坐；三、四人 2 × 2（第三人单独一行居中）。单号在左、双号在右，NABO 朝右指 2、4 号
const seatRight = p => p % 2 === 1;
const popcount = v => { let n = 0; for (; v; v &= v - 1) n++; return n; };

// ---------- 存储（只存本机偏好） ----------
function load(k, d) { try { const v = localStorage.getItem(k); return v ? { ...d, ...JSON.parse(v) } : { ...d }; } catch { return { ...d }; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 无痕模式等 */ } }
const SET_DEFAULT = { players: 2, ucPlayers: 5, target: 3, dicePer: 5, minOpen: 2, wild: true, sound: true, god: false };
const Cfg = load('table.settings', SET_DEFAULT);

// ---------- 可复现随机数（mulberry32），固件移植时用同一算法对拍 ----------
let seed = (Date.now() % 1000000) >>> 0, rngState = seed;
function rand() {
  rngState = (rngState + 0x6D2B79F5) >>> 0;
  let t = rngState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const randInt = n => Math.floor(rand() * n);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// 声音在 sound.js（SFX），牌和绒布在 cards.js，立体骰子在 dice3d.js

// ---------- 小工具 ----------
const clamp01 = x => Math.max(0, Math.min(1, x));
const easeOut = t => 1 - (1 - t) ** 3;
const easeIn = t => t * t * t;
const lerp = (a, b, t) => a + (b - a) * t;
const lerp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(s, x, y, o = {}) {
  ctx.font = `${o.weight || 400} ${o.size || 12}px ${o.font || F_BODY}`;
  ctx.fillStyle = o.color || '#fff';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'middle';
  ctx.fillText(s, x, y);
  return ctx.measureText(s).width;
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }

// ---------- 占位 NABO（等 Codex 出帧后替换成精灵） ----------
// 时长按 ART_BRIEF 第 6 节的帧数 / 12 fps；循环动作的占位时长放慢了一些
const ANIM = {
  idle: { dur: 2, loop: true }, shuffle: { dur: 0.9, loop: true }, deal: { dur: 0.33 },
  shake: { dur: 0.5, loop: true }, slam: { dur: 0.25 }, cover_in: { dur: 0.25, next: 'cover' },
  cover: { dur: 1.4, loop: true }, open: { dur: 0.45 }, point: { dur: 0.35, hold: true },
  surprise: { dur: 0.4 }, trophy: { dur: 1, loop: true }, shrug: { dur: 0.4, hold: true },
};
const nabo = { anim: 'idle', t: 0, mirror: false, queue: [] };
function naboPlay(name, opt = {}) {
  nabo.anim = name; nabo.t = 0; nabo.mirror = !!opt.mirror;
  nabo.queue = opt.then && opt.then.length ? [...opt.then] : ANIM[name].next ? [[ANIM[name].next, {}]] : [];
}
function animDur(name) {
  const sp = typeof spriteFor === 'function' && spriteFor(name, 'large');
  return sp && !sp.sheet.loop ? sp.sheet.n / sp.sheet.fps : ANIM[name].dur;
}
function naboUpdate(dt) {
  nabo.t += dt;
  const a = ANIM[nabo.anim];
  if (a.loop || a.hold || nabo.t < animDur(nabo.anim)) return;
  const q = nabo.queue, nx = q.shift() || ['idle', {}];
  naboPlay(nx[0], { ...nx[1], then: nx[1].then || q });
}
function pose(name, t) {
  const a = ANIM[name], p = a.loop ? (t % a.dur) / a.dur : clamp01(t / a.dur);
  const TAU = Math.PI * 2, S = Math.sin;
  const P = { l: [-40, -22], r: [40, -22], dy: 0, eyes: 'open', mouth: 'smile', prop: null, at: null, k: 0 };
  switch (name) {
    case 'idle': P.dy = S(p * TAU) * 1.5; P.l = [-40, -22 + P.dy]; P.r = [40, -22 + P.dy]; if (p > 0.92) P.eyes = 'blink'; break;
    case 'shuffle': { const k = S(p * TAU); P.l = [-28 - 6 * k, -34]; P.r = [28 + 6 * k, -34]; P.prop = 'deck2'; P.k = p; break; }
    case 'deal': { const e = easeOut(p); P.l = [-32, -34]; P.r = [26 - 16 * e, -34 + 22 * e]; P.prop = 'deal'; P.k = e; break; }
    case 'shake': { const k = S(p * TAU * 2); P.l = [-20, -66 + 10 * k]; P.r = [20, -66 + 10 * k]; P.prop = 'cup'; P.at = [0, -80 + 10 * k]; P.dy = k * 1.5; P.mouth = 'grin'; break; }
    case 'slam': { const e = easeIn(p); P.l = [-20, -66 + 46 * e]; P.r = [20, -66 + 46 * e]; P.prop = 'cup'; P.at = [0, -80 + 50 * e]; if (p > 0.8) P.eyes = 'squint'; break; }
    case 'cover_in': { const e = easeOut(p); P.l = lerp2([-40, -22], [-15, -108], e); P.r = lerp2([40, -22], [15, -108], e); break; }
    case 'cover': { const k = S(p * TAU) * 3; P.l = [-15 + k, -108]; P.r = [15 + k, -108]; P.head = k; break; }
    case 'open': { const e = easeOut(clamp01(p * 1.6)); P.r = lerp2([40, -22], [34, -158], e); P.mouth = p > 0.4 ? 'shout' : 'o'; P.eyes = p > 0.4 ? 'wide' : 'open'; P.dy = -4 * S(Math.PI * p); break; }
    case 'point': { const e = easeOut(p); P.r = lerp2([40, -22], [-86, -62], e); P.mouth = 'grin'; P.head = -4 * e; break; }
    case 'surprise': P.dy = -8 * S(Math.PI * p); P.l = [-54, -96]; P.r = [54, -96]; P.eyes = 'wide'; P.mouth = 'o'; break;
    case 'trophy': { const k = S(p * TAU); P.l = [-16, -156 + 3 * k]; P.r = [16, -156 + 3 * k]; P.prop = 'trophy'; P.at = [0, -174 + 3 * k]; P.mouth = 'grin'; P.eyes = 'happy'; P.dy = k; break; }
    case 'shrug': { const e = easeOut(p); P.l = lerp2([-40, -22], [-64, -48], e); P.r = lerp2([40, -22], [64, -48], e); P.mouth = 'flat'; P.dy = -3 * e; break; }
  }
  return P;
}
function drawFace(P, hx, hy) {
  ctx.fillStyle = C.ink; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  for (const sx of [-1, 1]) {
    const ex = hx + sx * 13, ey = hy - 2;
    if (P.eyes === 'blink') { ctx.beginPath(); ctx.moveTo(ex - 5, ey); ctx.lineTo(ex + 5, ey); ctx.stroke(); }
    else if (P.eyes === 'wide') { ctx.fillStyle = '#fff'; circle(ex, ey, 8); ctx.fill(); ctx.stroke(); ctx.fillStyle = C.ink; circle(ex, ey, 3.5); ctx.fill(); }
    else if (P.eyes === 'happy') { ctx.beginPath(); ctx.arc(ex, ey + 3, 6, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
    else if (P.eyes === 'squint') { ctx.beginPath(); ctx.moveTo(ex - 5 * sx, ey - 4); ctx.lineTo(ex + 4 * sx, ey); ctx.lineTo(ex - 5 * sx, ey + 4); ctx.stroke(); }
    else { circle(ex, ey, 4.5); ctx.fill(); }
  }
  const my = hy + 16;
  ctx.beginPath();
  if (P.mouth === 'o') { ctx.ellipse(hx, my, 5, 6.5, 0, 0, Math.PI * 2); ctx.fillStyle = '#5a1f22'; ctx.fill(); ctx.stroke(); }
  else if (P.mouth === 'shout') { ctx.ellipse(hx, my + 1, 11, 9, 0, 0, Math.PI * 2); ctx.fillStyle = '#5a1f22'; ctx.fill(); ctx.stroke(); }
  else if (P.mouth === 'grin') { ctx.arc(hx, my - 4, 10, Math.PI * 0.15, Math.PI * 0.85); ctx.closePath(); ctx.fillStyle = '#5a1f22'; ctx.fill(); ctx.stroke(); }
  else if (P.mouth === 'flat') { ctx.moveTo(hx - 7, my); ctx.lineTo(hx + 7, my); ctx.stroke(); }
  else { ctx.arc(hx, my - 6, 8, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke(); }
}
function drawCup(x, y, s) {
  // 和视频里 NABO 手上的骰盅一致：梅紫色、略收口的圆筒，圆顶，底部一道黄铜边
  ctx.save();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6;
  const g = ctx.createLinearGradient(x - 18 * s, 0, x + 18 * s, 0);
  g.addColorStop(0, '#3E1A2C'); g.addColorStop(0.35, '#7A3352'); g.addColorStop(0.6, '#5C2440'); g.addColorStop(1, '#2E1220');
  ctx.beginPath();
  ctx.moveTo(x - 15 * s, y - 30 * s);
  ctx.quadraticCurveTo(x, y - 37 * s, x + 15 * s, y - 30 * s);
  ctx.lineTo(x + 18 * s, y - 4 * s); ctx.lineTo(x - 18 * s, y - 4 * s); ctx.closePath();
  ctx.fillStyle = g; ctx.fill(); ctx.stroke();
  const b = ctx.createLinearGradient(0, y - 6 * s, 0, y);
  b.addColorStop(0, '#E9C873'); b.addColorStop(1, '#9B7524');
  rr(x - 19 * s, y - 6 * s, 38 * s, 6 * s, 2 * s); ctx.fillStyle = b; ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,220,240,.18)'; rr(x - 10 * s, y - 29 * s, 4 * s, 20 * s, 2 * s); ctx.fill();
  ctx.restore();
}
function drawTrophy(x, y) {
  ctx.fillStyle = C.brass; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x - 16, y - 18); ctx.lineTo(x + 16, y - 18); ctx.quadraticCurveTo(x + 14, y + 4, x, y + 6);
  ctx.quadraticCurveTo(x - 14, y + 4, x - 16, y - 18); ctx.fill(); ctx.stroke();
  rr(x - 3, y + 6, 6, 8, 1); ctx.fill(); ctx.stroke(); rr(x - 10, y + 14, 20, 5, 2); ctx.fill(); ctx.stroke();
}
function drawNaboPlaceholder(cx, rimY, h) {
  const P = pose(nabo.anim, nabo.t), s = h / 150, dy = P.dy;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, rimY); ctx.clip();
  ctx.translate(cx, rimY); ctx.scale(nabo.mirror ? -s : s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  // 躯干 + 领口 + 领结
  ctx.fillStyle = C.vest; rr(-46, -76 + dy, 92, 96, 28); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.shirt; ctx.beginPath(); ctx.moveTo(-17, -76 + dy); ctx.lineTo(17, -76 + dy); ctx.lineTo(0, -42 + dy); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.brass; ctx.beginPath(); ctx.moveTo(0, -70 + dy); ctx.lineTo(-11, -77 + dy); ctx.lineTo(-11, -63 + dy); ctx.closePath();
  ctx.moveTo(0, -70 + dy); ctx.lineTo(11, -77 + dy); ctx.lineTo(11, -63 + dy); ctx.closePath(); ctx.fill(); ctx.stroke();
  // 头
  const hx = P.head || 0, hy = -112 + dy;
  ctx.fillStyle = C.skin; circle(hx, hy, 38); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.vest; ctx.beginPath(); ctx.arc(hx, hy, 38, Math.PI * 1.08, Math.PI * 1.92); ctx.quadraticCurveTo(hx, hy - 22, hx - 36, hy - 12); ctx.fill(); ctx.stroke();
  drawFace(P, hx, hy);
  // 道具（手后面的部分）

const SPRITE_MAP = {

  const m = SPRITE_MAP[anim], key = typeof m === 'function' ? m() : m;

  const other = size === 'large' ? 'small' : 'large', S = window.NABO_SPRITES || {};

  if (!sp) { drawNaboPlaceholder(cx, rimY, h); return; }
  const { sheet, img, size } = sp, n = sheet.n;
  const f = Math.floor(nabo.t * sheet.fps);
  const i = sheet.loop ? f % n : Math.min(n - 1, f);
  // 帧本身按 150 / 72 px 高做好了；h 和档位不同时按比例缩放
  const k = h / (size === 'large' ? 150 : 72);

function handTotal(hand) {

const cellX = p => (G.np === 3 && p === 2 ? 66 : seatRight(p) ? 124 : 8);

const BJ_FLIP0 = 0.5, BJ_FLIP_STEP = 0.12;
function bjFlipT(p, i) {
  let idx = i;   // 按座位顺序一张张翻

function bjRevealUpdate() {

window.addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (!k || e.target.closest('input, select, textarea')) return;
  e.preventDefault(); if (!e.repeat) keyDown(k);
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { e.preventDefault(); keyUp(k); } });
window.addEventListener('blur', () => Object.keys(held).forEach(keyUp));
for (const [k, el] of Object.entries(KEYBTN)) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); keyDown(k); });
  el.addEventListener('pointerup', () => keyUp(k));
  el.addEventListener('pointercancel', () => keyUp(k));
  el.addEventListener('keydown', e => { if (e.code === 'Enter' || e.code === 'Space') e.stopPropagation(); });
}

// ---------- 主循环 ----------
function update(dt) {
  clock += dt; G.t += dt;
  naboUpdate(dt); inputUpdate();
  if (G.pause) return;
  if (G.scene === 'bjDeal') bjDealUpdate();
  else if (G.scene === 'bjReveal') bjRevealUpdate();
  else if (G.scene === 'diceRoll') diceRollUpdate();
  else if (G.scene === 'diceReveal') diceRevealUpdate();
}
function draw() {
  switch (G.scene) {
    case 'menu': drawMenu(); break;
    case 'handoff': G.game === 'uc' ? drawUcHandoff() : drawHandoff(); break;
    case 'ucSetup': case 'ucWord': case 'ucTalk': case 'ucVote': case 'ucOut': case 'ucEnd': drawUc(); break;
    case 'bjDeal': case 'bjReveal': drawBjPublic(); break;
    case 'bjTurn': drawBjTurn(); break;
    case 'diceRoll': case 'diceReveal': drawDicePublic(); break;
    case 'diceTurn': drawDiceTurn(); break;
    case 'end': drawEnd(); break;
  }
  if (G.pause) drawPause();
  drawHoldRing();
}
let last = performance.now(), panelT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  if ((panelT += dt) > 0.2) { panelT = 0; renderLive(); }
  requestAnimationFrame(frame);
}

// ---------- 面板 ----------
const SLIDERS = [['tPlayers', 'oPlayers', 'players'], ['tTarget', 'oTarget', 'target'], ['tDice', 'oDice', 'dicePer'], ['tOpen', 'oOpen', 'minOpen']];
function syncPanel() {
  for (const [i, o, k] of SLIDERS) { $(i).value = Cfg[k]; $(o).textContent = Cfg[k]; }
  $('oWild').checked = Cfg.wild; $('oSound').checked = Cfg.sound; $('oGod').checked = Cfg.god;
  $('god').hidden = !Cfg.god; $('seed').value = seed;
}
for (const [i, , k] of SLIDERS) $(i).addEventListener('input', e => { Cfg[k] = Number(e.target.value); save('table.settings', Cfg); syncPanel(); });
for (const [id, k] of [['oWild', 'wild'], ['oSound', 'sound'], ['oGod', 'god']])
  $(id).addEventListener('change', e => { Cfg[k] = e.target.checked; save('table.settings', Cfg); syncPanel(); });
$('reseed').addEventListener('click', () => {
  const v = parseInt($('seed').value, 10);
  if (Number.isFinite(v)) seed = v >>> 0;
  rngState = seed; G.pause = null; log(`种子 ${seed}`); toMenu(); syncPanel();
});
const SCENE_NAME = { menu: '封面', handoff: '交接屏', bjDeal: '21 点 · 发牌', bjTurn: '21 点 · 私密回合', bjReveal: '21 点 · 开牌',
  diceRoll: '大话骰 · 摇盅', diceTurn: '大话骰 · 私密回合', diceReveal: '大话骰 · 开盅', end: '整场结束',
  ucSetup: '卧底 · 人数', ucWord: '卧底 · 看词', ucTalk: '卧底 · 描述', ucVote: '卧底 · 投票', ucOut: '卧底 · 出局', ucEnd: '卧底 · 结果' };
let liveCache = '';
function renderLive() {
  const rows = [['画面', SCENE_NAME[G.scene] + (G.pause ? '（暂停）' : '')], ['NABO 动作', nabo.anim + (nabo.mirror ? '（镜像）' : '')]];
  if (G.game) rows.push([G.game === 'dice' ? '罚分' : '比分', `${G.score.join(' : ')} · 第 ${G.round} 局`]);
  if (G.game === 'bj' && G.bj) rows.push(['牌堆剩余', `${G.bj.deck.length} 张`]);
  if (G.game === 'dice' && G.dc) rows.push(['叫数次数', String(G.dc.bids.length)]);
  rows.push(['种子', String(seed)]);
  let god = '';
  if (Cfg.god && G.game === 'bj' && G.bj) god = G.bj.hands.map((h, p) => `${PNAME[p]}：${h.map(c => SUITS[c.s] + RANKS[c.r]).join(' ')}  = ${handTotal(h).total}`).join('\n');
  if (Cfg.god && G.game === 'dice' && G.dc) god = G.dc.dice.map((d, p) => `${PNAME[p]}：${d.join(' ')}`).join('\n');
  const html = rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
  if (html + god !== liveCache) { liveCache = html + god; $('live').innerHTML = html; $('god').textContent = god || '（对局开始后显示）'; }
}
function renderLog() { $('log').innerHTML = logItems.map(s => `<li>${s}</li>`).join(''); }

// 调试钩子：TABLE.press('ok')、TABLE.hold('ok', 2100)、TABLE.state()
window.TABLE = {
  press(k) { keyDown(k); keyUp(k); },
  hold(k, ms) { keyDown(k); const end = held[k] + ms / 1000; const tick = () => { if (clock >= end) keyUp(k); else requestAnimationFrame(tick); }; tick(); },
  state: () => JSON.parse(JSON.stringify({ scene: G.scene, score: G.score, round: G.round, turn: G.turn, pause: G.pause, result: G.result, bj: G.bj && { hands: G.bj.hands, stood: G.bj.stood, phase: G.bj.phase }, dc: G.dc && { dice: G.dc.dice, bids: G.dc.bids, step: G.dc.step, q: G.dc.qList[G.dc.qi], f: G.dc.fList[G.dc.fi] } })),
  get G() { return G; },
  // 页面在后台时 rAF 不跑，用它手动快进（秒）
  advance(sec) { for (let i = 0; i < Math.round(sec * 60); i++) update(1 / 60); draw(); },
};

syncPanel(); menuSelect(0);
Promise.allSettled([`700 12px ${F_BODY}`, `12px ${F_MONO}`, `12px ${F_DISP}`].map(f => document.fonts.load(f))).finally(() => requestAnimationFrame(frame));
</script>
